# Production Docker Compose for Managed Services Architecture
# Uses Neon.tech (PostgreSQL) and Chroma Cloud (Vector DB) - no local database
# Note: This replaces the previous version that included PostgreSQL

services:
  # PostgreSQL service removed - using Neon.tech managed database
  # All database operations go through DATABASE_URL (Neon.tech connection string)

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod.simple
    image: metaspn-backend:latest
    container_name: metaspn-backend-prod
    environment:
      # Neon.tech PostgreSQL connection
      DATABASE_URL: ${DATABASE_URL}  # From Neon.tech connection string
      # Chroma Cloud
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      CHROMA_TENANT: ${CHROMA_TENANT}
      CHROMA_DATABASE: ${CHROMA_DATABASE}
      # CHROMA_API_URL is only needed for self-hosted Chroma (not Chroma Cloud)
      CHROMA_API_URL: ${CHROMA_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
      # Disable Mastra for simple build (OAuth routes will work, Mastra features disabled)
      USE_MASTRA: false
      # Mastra server port configuration
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
      GITHUB_PUSH_CRON: ${GITHUB_PUSH_CRON:-0 */6 * * *}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "127.0.0.1:3001:3001"  # Only bind to localhost (nginx will proxy)
    # No depends_on - database is external (Neon.tech)
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    image: metaspn-frontend:latest
    container_name: metaspn-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"  # Only bind to localhost (nginx will proxy)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'      # Reduced - no local database
          memory: 256M   # Reduced - no local database
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    image: metaspn-backend:latest
    container_name: metaspn-worker-prod
    environment:
      # Neon.tech PostgreSQL connection
      DATABASE_URL: ${DATABASE_URL}
      # Chroma Cloud
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      CHROMA_TENANT: ${CHROMA_TENANT}
      CHROMA_DATABASE: ${CHROMA_DATABASE}
      # CHROMA_API_URL is only needed for self-hosted Chroma (not Chroma Cloud)
      CHROMA_API_URL: ${CHROMA_API_URL:-}
      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
      GITHUB_PUSH_CRON: ${GITHUB_PUSH_CRON:-0 */6 * * *}
    # Worker uses tsx to run TypeScript directly (tsx is installed in production image)
    # Use node_modules path directly to avoid pnpm store location issues
    command: ["sh", "-c", "cd /app/backend && node node_modules/.bin/tsx src/worker.ts || node ../node_modules/.bin/tsx src/worker.ts"]
    depends_on:
      - backend
    # No postgres dependency - database is external (Neon.tech)
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Reduced - no local database
          memory: 128M   # Reduced - no local database
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database backup service removed - Neon.tech handles backups automatically

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    image: metaspn-nginx:latest
    container_name: metaspn-nginx-prod
    pull_policy: build
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates (must exist on host at /etc/nginx/ssl/)
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      # Mount certbot webroot for Let's Encrypt challenges
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - metaspn-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  metaspn-network:
    driver: bridge
