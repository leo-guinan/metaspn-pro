# Production Docker Compose for Managed Services Architecture
# Uses Neon.tech (PostgreSQL) and Chroma Cloud (Vector DB) - no local database

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    image: metaspn-backend:latest
    container_name: metaspn-backend-prod
    environment:
      # Neon.tech PostgreSQL connection
      DATABASE_URL: ${DATABASE_URL}  # From Neon.tech
      # Chroma Cloud
      CHROMA_API_URL: ${CHROMA_API_URL:-https://api.trychroma.com}
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # OAuth
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
      GITHUB_PUSH_CRON: ${GITHUB_PUSH_CRON:-0 */6 * * *}
      FRONTEND_URL: ${FRONTEND_URL}
      GAME_CLASSIFIER_URL: ${GAME_CLASSIFIER_URL:-http://game-classifier:5000}
    ports:
      - "127.0.0.1:3001:3001"  # Only bind to localhost (nginx will proxy)
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'      # Reduced - no local database
          memory: 256M   # Reduced - no local database
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    image: metaspn-frontend:latest
    container_name: metaspn-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"  # Only bind to localhost (nginx will proxy)
    depends_on:
      - backend
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'      # Reduced - no local database
          memory: 256M   # Reduced - no local database
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    image: metaspn-backend:latest
    container_name: metaspn-worker-prod
    environment:
      # Neon.tech PostgreSQL connection
      DATABASE_URL: ${DATABASE_URL}
      # Chroma Cloud
      CHROMA_API_URL: ${CHROMA_API_URL:-https://api.trychroma.com}
      CHROMA_API_KEY: ${CHROMA_API_KEY}
      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NODE_ENV: production
      GITHUB_PUSH_CRON: ${GITHUB_PUSH_CRON:-0 */6 * * *}
      GAME_CLASSIFIER_URL: ${GAME_CLASSIFIER_URL:-http://game-classifier:5000}
    command: ["sh", "-c", "cd /app/backend && pnpm exec tsx src/worker.ts"]
    depends_on:
      - backend
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Reduced - no local database
          memory: 128M   # Reduced - no local database
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Private image: run `docker login ghcr.io` first (see DOCKER.md).
  game-classifier:
    image: ghcr.io/metaspn/game-classifier:v1.0.5
    container_name: metaspn-game-classifier-prod
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      USE_SUB_MANIFOLDS: "false"
      WORKERS: "1"
      MAX_BATCH_SIZE: "100"
    ports:
      - "127.0.0.1:3002:5000"
    networks:
      - metaspn-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  metaspn-network:
    driver: bridge

# Note: No PostgreSQL service - using Neon.tech
# Note: No backup service - Neon handles backups automatically
