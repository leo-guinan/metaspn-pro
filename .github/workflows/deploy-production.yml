name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
  
# Only deploy if CI workflow completed successfully
# This ensures docker-build job finished before we try to pull images

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    # Only run if CI workflow completed successfully (not on failure/cancellation)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # When triggered by workflow_run, checkout the commit that triggered CI
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify CI workflow completed successfully
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI workflow did not complete successfully (status: ${{ github.event.workflow_run.conclusion }})"
            echo "   Skipping deployment"
            exit 1
          fi
          echo "✅ CI workflow completed successfully"
          echo "   CI workflow run: ${{ github.event.workflow_run.html_url }}"
          echo "   Commit SHA: ${{ github.event.workflow_run.head_sha }}"
      
      - name: Verify CI docker-build job completed
        if: github.event_name == 'workflow_run'
        run: |
          echo "🔍 Verifying CI workflow's docker-build job completed..."
          # Check CI workflow run details via API
          CI_RUN_ID="${{ github.event.workflow_run.id }}"
          echo "   CI workflow run ID: $CI_RUN_ID"
          echo "   CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          # Note: workflow_run triggers when workflow completes, but we need to ensure
          # the docker-build job specifically succeeded. The if condition above checks
          # for overall success, which should be sufficient if docker-build is required.
          
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI workflow did not succeed - docker-build may have failed"
            exit 1
          fi
          
          echo "✅ CI workflow completed successfully - docker-build job should have finished"

      - name: Verify SSH key format
        run: |
          echo "🔍 Verifying SSH key format..."
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "❌ PRODUCTION_SSH_KEY secret is empty!"
            exit 1
          fi
          
          # Check if key has proper headers
          KEY="${{ secrets.PRODUCTION_SSH_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ Key has proper BEGIN/END markers"
          else
            echo "❌ Key missing BEGIN/END markers!"
            echo "Key should start with: -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          
          # Extract and show key type
          if echo "$KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "✅ Key type: OpenSSH format"
          elif echo "$KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "✅ Key type: RSA format"
          else
            echo "⚠️  Unknown key format"
          fi
          
          # Show first and last lines (without exposing full key)
          echo "Key preview (first 50 chars):"
          echo "$KEY" | head -1 | cut -c1-50
          echo "..."
          echo "Key preview (last 50 chars):"
          echo "$KEY" | tail -1 | cut -c1-50

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          timeout: 30s
          script: |
            echo "🔍 Testing SSH connection..."
            echo "Hostname: $(hostname)"
            echo "User: $(whoami)"
            echo "Working directory: $(pwd)"
            echo "✅ SSH connection successful!"

      - name: Copy docker-compose file and scripts to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            # Ensure directory exists
            mkdir -p /opt/metaspn/scripts
            
            # Download docker-compose.prod.yml from GitHub raw content
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" \
              -o /opt/metaspn/docker-compose.prod.yml
            
            # Verify file was downloaded
            if [ ! -f /opt/metaspn/docker-compose.prod.yml ]; then
              echo "❌ Failed to download docker-compose.prod.yml"
              exit 1
            fi
            
            # Validate YAML syntax
            docker compose -f /opt/metaspn/docker-compose.prod.yml config > /dev/null 2>&1 || {
              echo "❌ Invalid YAML in docker-compose.prod.yml"
              exit 1
            }
            
            echo "✅ docker-compose.prod.yml updated and validated"
            
            # Download scripts from repository
            echo "📥 Downloading scripts..."
            SCRIPTS=(
              "scripts/debug-domain.sh"
              "scripts/check-deployment-permissions.sh"
              "scripts/fix-nginx.sh"
              "scripts/check-backend-health.sh"
              "scripts/check-backend-startup.sh"
              "scripts/check-frontend-url.sh"
              "scripts/fix-disk-space.sh"
              "scripts/fix-docker-permissions.sh"
            )
            
            for script in "${SCRIPTS[@]}"; do
              script_name=$(basename "$script")
              curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/$script" \
                -o "/opt/metaspn/scripts/$script_name" && \
              chmod +x "/opt/metaspn/scripts/$script_name" && \
              echo "✅ Downloaded $script_name" || \
              echo "⚠️  Failed to download $script_name (may not exist yet)"
            done
            
            # Download Nginx configuration files (needed for building Nginx image)
            # Note: Files must be in nginx/ subdirectory to match Dockerfile COPY paths
            echo "📥 Downloading Nginx configuration..."
            mkdir -p /opt/metaspn/nginx/conf.d
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/nginx.conf" \
              -o /opt/metaspn/nginx/nginx.conf && \
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/conf.d/metaspn.conf" \
              -o /opt/metaspn/nginx/conf.d/metaspn.conf && \
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/nginx/Dockerfile" \
              -o /opt/metaspn/nginx/Dockerfile && \
            echo "✅ Nginx configuration downloaded" || \
            echo "⚠️  Failed to download Nginx configuration (Nginx may not build)"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          script: |
            set -e
            cd /opt/metaspn
            
            # Check for .env file in multiple locations
            ENV_FILE=""
            if [ -f /etc/metaspn/.env.prod ]; then
              echo "📋 Found .env file at /etc/metaspn/.env.prod (root-owned, secure location)"
              ENV_FILE="/etc/metaspn/.env.prod"
            elif [ -f /opt/metaspn/.env ]; then
              echo "📋 Found .env file at /opt/metaspn/.env"
              ENV_FILE="/opt/metaspn/.env"
            else
              echo "❌ .env file not found!"
              echo "⚠️  Expected locations:"
              echo "   - /etc/metaspn/.env.prod (recommended, root-owned)"
              echo "   - /opt/metaspn/.env"
              echo "⚠️  Please ensure the .env file is created on the server with all required variables"
              exit 1
            fi
            
            # If using /etc/metaspn/.env.prod, verify we can read it
            if [ "$ENV_FILE" = "/etc/metaspn/.env.prod" ]; then
              if [ ! -r "$ENV_FILE" ]; then
                echo "⚠️  Cannot read $ENV_FILE (permission denied)"
                echo ""
                echo "💡 SOLUTION: Copy the .env file to /opt/metaspn/.env manually (one-time setup):"
                echo "   Run this command ONCE on the server as root or with sudo:"
                echo "   sudo cp /etc/metaspn/.env.prod /opt/metaspn/.env"
                echo "   sudo chown metaspn:metaspn /opt/metaspn/.env"
                echo "   sudo chmod 600 /opt/metaspn/.env"
                echo ""
                echo "   After that, the deployment will use /opt/metaspn/.env automatically."
                echo ""
                echo "❌ Deployment cannot proceed without readable .env file"
                exit 1
              else
                # Can read it directly, use it
                echo "✅ Can read $ENV_FILE directly"
              fi
            fi
            
            # Ensure .env file is protected (read-only for owner, no access for others)
            if [ "$ENV_FILE" = "/opt/metaspn/.env" ] && [ -f "$ENV_FILE" ]; then
              chmod 600 "$ENV_FILE" || true
            fi
            
            # Verify FRONTEND_URL is set correctly (critical for OAuth redirects)
            echo "🔍 Verifying FRONTEND_URL configuration..."
            if grep -q "^FRONTEND_URL=" "$ENV_FILE"; then
              FRONTEND_URL_VALUE=$(grep "^FRONTEND_URL=" "$ENV_FILE" | cut -d '=' -f2- | tr -d '"' | tr -d "'" | xargs)
              if [ -z "$FRONTEND_URL_VALUE" ]; then
                echo "❌ ERROR: FRONTEND_URL is empty in $ENV_FILE"
                echo "   💡 Fix: Set FRONTEND_URL=https://pro.metaspn.network in $ENV_FILE"
                exit 1
              elif echo "$FRONTEND_URL_VALUE" | grep -qiE "^(https?://)?(localhost|127\.0\.0\.1)"; then
                echo "❌ ERROR: FRONTEND_URL is set to localhost: $FRONTEND_URL_VALUE"
                echo "   💡 Fix: Set FRONTEND_URL=https://pro.metaspn.network in $ENV_FILE"
                echo "   This will cause OAuth redirects to fail in production!"
                exit 1
              else
                echo "✅ FRONTEND_URL is set correctly: $FRONTEND_URL_VALUE"
              fi
            else
              echo "❌ ERROR: FRONTEND_URL not found in $ENV_FILE"
              echo "   💡 Fix: Add FRONTEND_URL=https://pro.metaspn.network to $ENV_FILE"
              exit 1
            fi
            
            # Check disk space before pulling images
            echo "🔍 Checking disk space..."
            AVAILABLE_SPACE=$(df / | tail -1 | awk '{print $4}')
            AVAILABLE_SPACE_MB=$((AVAILABLE_SPACE / 1024))
            echo "Available space: ${AVAILABLE_SPACE_MB}MB"
            
            if [ $AVAILABLE_SPACE_MB -lt 2000 ]; then
              echo "⚠️  WARNING: Less than 2GB available. Cleaning up Docker resources..."
              # Remove unused images (keep last 2 versions)
              docker image prune -a -f --filter "until=48h" || docker image prune -a -f
              # Remove unused containers and volumes
              docker container prune -f
              docker volume prune -f
              # Remove build cache
              docker builder prune -a -f --filter "until=24h" || docker builder prune -a -f
              
              # Check again
              AVAILABLE_SPACE=$(df / | tail -1 | awk '{print $4}')
              AVAILABLE_SPACE_MB=$((AVAILABLE_SPACE / 1024))
              echo "Available space after cleanup: ${AVAILABLE_SPACE_MB}MB"
              
              if [ $AVAILABLE_SPACE_MB -lt 1000 ]; then
                echo "❌ ERROR: Still less than 1GB available after cleanup!"
                echo "   💡 Manual cleanup required. Run on server:"
                echo "      bash /opt/metaspn/scripts/fix-disk-space.sh"
                echo "   Or manually: docker system prune -a -f --volumes"
                exit 1
              fi
            fi
            
            # Determine which commit SHA to use (from CI workflow or current commit)
            COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "📋 Using commit SHA: $COMMIT_SHA"
            echo "   CI workflow run: ${{ github.event.workflow_run.html_url || 'N/A (manual trigger)' }}"
            
            # Pull latest app images (backend, frontend) - these were built by CI workflow
            # Add retry logic in case images are still being pushed to registry
            echo "📥 Pulling images built by CI workflow..."
            
            pull_image_with_retry() {
              local image=$1
              local max_attempts=5
              local attempt=1
              local wait_time=10
              
              while [ $attempt -le $max_attempts ]; do
                echo "   Attempt $attempt/$max_attempts: Pulling $image..."
                if docker pull "$image" 2>&1; then
                  echo "   ✅ Successfully pulled $image"
                  return 0
                fi
                
                if [ $attempt -lt $max_attempts ]; then
                  echo "   ⚠️  Failed to pull, waiting ${wait_time}s before retry..."
                  sleep $wait_time
                  wait_time=$((wait_time + 5))  # Exponential backoff
                fi
                attempt=$((attempt + 1))
              done
              
              echo "   ❌ Failed to pull $image after $max_attempts attempts"
              return 1
            }
            
            if ! pull_image_with_retry "ghcr.io/${{ github.repository }}/backend:$COMMIT_SHA"; then
              echo "❌ Failed to pull backend image after retries"
              echo "   Expected: ghcr.io/${{ github.repository }}/backend:$COMMIT_SHA"
              echo "   💡 CI workflow's docker-build job may not have completed yet, or images failed to push"
              echo "   Check CI workflow: ${{ github.event.workflow_run.html_url || 'N/A' }}"
              exit 1
            fi
            
            if ! pull_image_with_retry "ghcr.io/${{ github.repository }}/frontend:$COMMIT_SHA"; then
              echo "❌ Failed to pull frontend image after retries"
              echo "   Expected: ghcr.io/${{ github.repository }}/frontend:$COMMIT_SHA"
              echo "   💡 CI workflow's docker-build job may not have completed yet, or images failed to push"
              echo "   Check CI workflow: ${{ github.event.workflow_run.html_url || 'N/A' }}"
              exit 1
            fi

            docker tag ghcr.io/${{ github.repository }}/backend:$COMMIT_SHA metaspn-backend:latest
            docker tag ghcr.io/${{ github.repository }}/frontend:$COMMIT_SHA metaspn-frontend:latest
            
            # SSL certs for Nginx must exist in /etc/nginx/ssl (readable by deploy user).
            # /etc/letsencrypt/ is root-only; deploy runs as PRODUCTION_USER (e.g. metaspn).
            # Copy certs there as root: sudo bash /opt/metaspn/scripts/fix-nginx.sh
            if [ -f /etc/nginx/ssl/fullchain.pem ] && [ -f /etc/nginx/ssl/privkey.pem ]; then
              echo "✅ SSL certificates found in /etc/nginx/ssl"
            else
              echo "❌ SSL certificates not found in /etc/nginx/ssl"
              echo "   Deploy cannot read /etc/letsencrypt (root-only). As root, run:"
              echo "   sudo bash /opt/metaspn/scripts/fix-nginx.sh"
              echo "   That copies certs from /etc/letsencrypt to /etc/nginx/ssl and sets permissions."
              exit 1
            fi
            
            # Build Nginx image (not in registry; built on server from nginx/ in repo)
            echo "🔨 Building Nginx image..."
            # Fix Docker cache directory permission issues
            # Ensure home directory exists
            if [ ! -d "$HOME" ]; then
              echo "⚠️  Home directory doesn't exist, creating it..."
              mkdir -p "$HOME"
              chmod 755 "$HOME" 2>/dev/null || true
            fi
            # Ensure .docker directory exists and is writable
            mkdir -p "$HOME/.docker" 2>/dev/null || {
              echo "⚠️  Cannot create $HOME/.docker, using alternative location..."
              export DOCKER_CONFIG=/tmp/.docker-$(whoami)
              mkdir -p "$DOCKER_CONFIG"
            }
            # Build Nginx image (disable BuildKit if it causes permission issues)
            DOCKER_BUILDKIT=0 docker compose -f docker-compose.prod.yml build nginx || {
              echo "⚠️  Build with BuildKit disabled failed, trying with cache disabled..."
              DOCKER_BUILDKIT=0 docker compose -f docker-compose.prod.yml build --no-cache nginx
            }
            
            # Recreate all containers with new images. Do NOT use 'down' – it would tear down
            # Nginx too; if Nginx then failed to start, the site would be broken.
            echo "🚀 Recreating containers (backend, worker, frontend, nginx)..."
            docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" up -d --force-recreate backend worker frontend nginx
            
            # Wait for backend to be healthy
            echo "⏳ Waiting for backend to be healthy..."
            MAX_WAIT=120
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              if docker compose -f docker-compose.prod.yml ps backend | grep -q "healthy"; then
                echo "✅ Backend is healthy!"
                break
              fi
              if ! docker compose -f docker-compose.prod.yml ps backend | grep -q "Up"; then
                echo "❌ Backend container is not running. Logs:"
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
              echo "  Waiting... ($ELAPSED/$MAX_WAIT seconds)"
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Backend failed to become healthy within $MAX_WAIT seconds"
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            
            # Verify Nginx is running (reverse proxy; without it the site is unreachable)
            if ! docker compose -f docker-compose.prod.yml ps nginx | grep -q "Up"; then
              echo "❌ Nginx is not running. Logs:"
              docker compose -f docker-compose.prod.yml logs --tail=50 nginx
              exit 1
            fi
            echo "✅ Nginx is running"
            
            sleep 5
            
            # Verify all services are running
            echo "🏥 Verifying all services..."
            docker compose -f docker-compose.prod.yml ps
            
            # Test health endpoints
            echo "🔍 Testing health endpoints..."
            BACKEND_HEALTH=$(docker compose -f docker-compose.prod.yml exec -T backend node -e "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>&1 || echo "failed")
            if [ "$BACKEND_HEALTH" != "failed" ]; then
              echo "✅ Backend health check passed"
            else
              echo "❌ Backend health check failed"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              exit 1
            fi
            
            # Clean up old images (but NOT .env file or its backups)
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Verify .env file still exists after deployment
            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ CRITICAL: $ENV_FILE was removed during deployment!"
              echo "   💡 Restore from /etc/metaspn/.env.prod if needed:"
              echo "      sudo cp /etc/metaspn/.env.prod $ENV_FILE"
              echo "      sudo chown metaspn:metaspn $ENV_FILE"
              echo "      sudo chmod 600 $ENV_FILE"
              exit 1
            else
              echo "✅ .env file verified - still present after deployment"
            fi
            
            echo "✅ Deployment complete!"
