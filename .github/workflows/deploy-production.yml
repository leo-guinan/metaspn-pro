name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify SSH key format
        run: |
          echo "🔍 Verifying SSH key format..."
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "❌ PRODUCTION_SSH_KEY secret is empty!"
            exit 1
          fi
          
          # Check if key has proper headers
          KEY="${{ secrets.PRODUCTION_SSH_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ Key has proper BEGIN/END markers"
          else
            echo "❌ Key missing BEGIN/END markers!"
            echo "Key should start with: -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          
          # Extract and show key type
          if echo "$KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "✅ Key type: OpenSSH format"
          elif echo "$KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "✅ Key type: RSA format"
          else
            echo "⚠️  Unknown key format"
          fi
          
          # Show first and last lines (without exposing full key)
          echo "Key preview (first 50 chars):"
          echo "$KEY" | head -1 | cut -c1-50
          echo "..."
          echo "Key preview (last 50 chars):"
          echo "$KEY" | tail -1 | cut -c1-50

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          timeout: 30s
          script: |
            echo "🔍 Testing SSH connection..."
            echo "Hostname: $(hostname)"
            echo "User: $(whoami)"
            echo "Working directory: $(pwd)"
            echo "✅ SSH connection successful!"

      - name: Copy docker-compose file to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            # Ensure directory exists
            mkdir -p /opt/metaspn
            
            # Download docker-compose.prod.yml from GitHub raw content
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" \
              -o /opt/metaspn/docker-compose.prod.yml
            
            # Verify file was downloaded
            if [ ! -f /opt/metaspn/docker-compose.prod.yml ]; then
              echo "❌ Failed to download docker-compose.prod.yml"
              exit 1
            fi
            
            # Validate YAML syntax
            docker compose -f /opt/metaspn/docker-compose.prod.yml config > /dev/null 2>&1 || {
              echo "❌ Invalid YAML in docker-compose.prod.yml"
              exit 1
            }
            
            echo "✅ docker-compose.prod.yml updated and validated"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          script: |
            set -e
            cd /opt/metaspn
            
            # Verify .env file exists and create backup
            if [ ! -f .env ]; then
              echo "❌ .env file not found at /opt/metaspn/.env"
              echo "⚠️  Please ensure the .env file is created on the server with all required variables"
              exit 1
            fi
            
            # Create backup of .env file before any operations
            echo "💾 Backing up .env file..."
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S) || {
              echo "⚠️  Could not create .env backup, but continuing..."
            }
            
            # Ensure .env file is protected (read-only for owner, no access for others)
            chmod 600 .env || true
            
            # Pull latest images
            echo "📥 Pulling latest images..."
            docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            
            # Tag images for docker compose
            docker tag ghcr.io/${{ github.repository }}/backend:${{ github.sha }} metaspn-backend:latest
            docker tag ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} metaspn-frontend:latest
            
            # Stop existing containers gracefully
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down --timeout 30 || true
            
            # Deploy new containers (Docker Compose automatically loads .env from current directory)
            echo "🚀 Deploying new containers..."
            docker compose -f docker-compose.prod.yml --env-file .env up -d backend
            
            # Wait for backend to be healthy
            echo "⏳ Waiting for backend to be healthy..."
            MAX_WAIT=120
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              if docker compose -f docker-compose.prod.yml ps backend | grep -q "healthy"; then
                echo "✅ Backend is healthy!"
                break
              fi
              
              # Check if container crashed
              if ! docker compose -f docker-compose.prod.yml ps backend | grep -q "Up"; then
                echo "❌ Backend container is not running. Checking logs..."
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
              
              echo "  Waiting... ($ELAPSED/$MAX_WAIT seconds)"
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Backend failed to become healthy within $MAX_WAIT seconds"
              echo "📋 Backend logs:"
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              echo "📋 Backend container status:"
              docker compose -f docker-compose.prod.yml ps backend
              exit 1
            fi
            
            # Start frontend and worker
            echo "🚀 Starting frontend and worker..."
            docker compose -f docker-compose.prod.yml --env-file .env up -d frontend worker
            
            # Wait a bit for frontend to start
            sleep 10
            
            # Verify all services are running
            echo "🏥 Verifying all services..."
            docker compose -f docker-compose.prod.yml ps
            
            # Test health endpoints
            echo "🔍 Testing health endpoints..."
            BACKEND_HEALTH=$(docker compose -f docker-compose.prod.yml exec -T backend node -e "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>&1 || echo "failed")
            if [ "$BACKEND_HEALTH" != "failed" ]; then
              echo "✅ Backend health check passed"
            else
              echo "❌ Backend health check failed"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              exit 1
            fi
            
            # Clean up old images (but NOT .env file or its backups)
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Verify .env file still exists after deployment
            if [ ! -f .env ]; then
              echo "❌ CRITICAL: .env file was removed during deployment!"
              echo "🔄 Restoring from backup..."
              LATEST_BACKUP=$(ls -t .env.backup.* 2>/dev/null | head -1)
              if [ -n "$LATEST_BACKUP" ] && [ -f "$LATEST_BACKUP" ]; then
                cp "$LATEST_BACKUP" .env
                chmod 600 .env
                echo "✅ .env file restored from backup"
              else
                echo "❌ No backup found! Manual intervention required."
                exit 1
              fi
            else
              echo "✅ .env file verified - still present after deployment"
            fi
            
            # Clean up old .env backups (keep last 5)
            echo "🧹 Cleaning up old .env backups (keeping last 5)..."
            ls -t .env.backup.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            
            echo "✅ Deployment complete!"
