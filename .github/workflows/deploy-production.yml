name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify SSH key format
        run: |
          echo "🔍 Verifying SSH key format..."
          if [ -z "${{ secrets.PRODUCTION_SSH_KEY }}" ]; then
            echo "❌ PRODUCTION_SSH_KEY secret is empty!"
            exit 1
          fi
          
          # Check if key has proper headers
          KEY="${{ secrets.PRODUCTION_SSH_KEY }}"
          if echo "$KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ Key has proper BEGIN/END markers"
          else
            echo "❌ Key missing BEGIN/END markers!"
            echo "Key should start with: -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          
          # Extract and show key type
          if echo "$KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "✅ Key type: OpenSSH format"
          elif echo "$KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "✅ Key type: RSA format"
          else
            echo "⚠️  Unknown key format"
          fi
          
          # Show first and last lines (without exposing full key)
          echo "Key preview (first 50 chars):"
          echo "$KEY" | head -1 | cut -c1-50
          echo "..."
          echo "Key preview (last 50 chars):"
          echo "$KEY" | tail -1 | cut -c1-50

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          timeout: 30s
          script: |
            echo "🔍 Testing SSH connection..."
            echo "Hostname: $(hostname)"
            echo "User: $(whoami)"
            echo "Working directory: $(pwd)"
            echo "✅ SSH connection successful!"

      - name: Copy docker-compose file to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            # Ensure directory exists
            mkdir -p /opt/metaspn
            
            # Download docker-compose.prod.yml from GitHub raw content
            curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" \
              -o /opt/metaspn/docker-compose.prod.yml
            
            # Verify file was downloaded
            if [ ! -f /opt/metaspn/docker-compose.prod.yml ]; then
              echo "❌ Failed to download docker-compose.prod.yml"
              exit 1
            fi
            
            # Validate YAML syntax
            docker compose -f /opt/metaspn/docker-compose.prod.yml config > /dev/null 2>&1 || {
              echo "❌ Invalid YAML in docker-compose.prod.yml"
              exit 1
            }
            
            echo "✅ docker-compose.prod.yml updated and validated"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          debug: true
          script: |
            set -e
            cd /opt/metaspn
            
            # Pull latest images
            echo "📥 Pulling latest images..."
            docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            
            # Tag images for docker compose
            docker tag ghcr.io/${{ github.repository }}/backend:${{ github.sha }} metaspn-backend:latest
            docker tag ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} metaspn-frontend:latest
            
            # Run database migrations
            echo "🔄 Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm backend /scripts/run-migrations.sh || \
            echo "⚠️  Migration script not found, skipping..."
            
            # Deploy new containers
            echo "🚀 Deploying new containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend worker
            
            # Wait for health checks
            echo "⏳ Waiting for services to be healthy..."
            sleep 30
            
            # Health check
            echo "🏥 Running health checks..."
            /opt/metaspn/scripts/health-check.sh || {
              echo "❌ Health check failed, rolling back..."
              /opt/metaspn/scripts/rollback.sh
              exit 1
            }
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment complete!"
            
            echo "✅ Deployment complete!"
